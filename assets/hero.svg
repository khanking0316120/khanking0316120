<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.45" stop-color="#101426"/>
      <stop offset="1" stop-color="#07111A"/>
    </linearGradient>
    <linearGradient id="title" x1="250" y1="100" x2="960" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E7FF">
        <animate attributeName="stop-color" values="#00E7FF;#8B5CF6;#22D3EE;#00E7FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.52" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#EC4899;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#00E7FF;#8B5CF6;#EC4899" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orb1">
      <stop stop-color="#7C3AED" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2">
      <stop stop-color="#06B6D4" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="30" fill="url(#grid)"/>

  <circle cx="150" cy="250" r="190" fill="url(#orb1)">
    <animate attributeName="cx" values="120;220;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="70" r="190" fill="url(#orb2)">
    <animate attributeName="cy" values="40;150;40" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.9">
    <circle cx="54" cy="48" r="6" fill="#FF5F57"/>
    <circle cx="78" cy="48" r="6" fill="#FEBC2E"/>
    <circle cx="102" cy="48" r="6" fill="#28C840"/>
    <text x="130" y="54" fill="#8892A6" font-family="monospace" font-size="15">massab@github: ~/profile</text>
  </g>

  <text x="600" y="134" text-anchor="middle" fill="url(#title)" filter="url(#glow)"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="800">
    MUHAMMED MASSAB
  </text>
  <text x="600" y="182" text-anchor="middle" fill="#E5E7EB"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">
    FULL STACK • FLUTTER • AI AUTOMATION
  </text>

  <g font-family="monospace" font-size="17">
    <text x="360" y="232" fill="#22D3EE">$ build --future</text>
    <rect x="532" y="216" width="9" height="21" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.75">
    <path d="M90 286H1110" stroke="#22D3EE" stroke-opacity="0.16"/>
    <path d="M90 296H890" stroke="#8B5CF6" stroke-opacity="0.12"/>
    <circle cx="1088" cy="286" r="4" fill="#22D3EE">
      <animate attributeName="cx" values="90;1110;90" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
